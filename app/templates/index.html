<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gwunder - Triple Store Explorer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Gwunder</h1>
        <p class="subtitle">Triple Store Explorer</p>
    </header>

    <section class="config-panel">
        <div class="config-group">
            <label for="endpoint">Endpoint</label>
            <select id="endpoint"></select>
        </div>
        <div class="config-group">
            <label for="limit">Limit</label>
            <input type="number" id="limit" value="100" min="1" max="1000">
        </div>
    </section>

    <section class="search-panel">
        <form id="search-form">
            <input type="text" id="uri-input" placeholder="Enter a URI (e.g. http://dbpedia.org/resource/Bern)">
            <button type="submit" class="btn-go">Go</button>
        </form>
    </section>

    <section id="results-section" class="results-section" hidden>
        <div class="sticky-header">
            <h2 id="displayed-uri" class="displayed-uri"></h2>
            <div id="results-count" class="results-count"></div>
            <div class="table-header">
                <div class="table-header-row">
                    <span>Predicate</span>
                    <span>Object</span>
                    <span>Label</span>
                    <span>Type</span>
                </div>
                <div class="table-header-row filter-row">
                    <input type="text" id="filter-predicate" placeholder="Filter...">
                    <input type="text" id="filter-object" placeholder="Filter...">
                    <input type="text" id="filter-label" placeholder="Filter...">
                    <input type="text" id="filter-type" placeholder="Filter...">
                </div>
            </div>
        </div>
        <table id="results-table">
            <colgroup>
                <col class="col-predicate">
                <col class="col-object">
                <col class="col-label">
                <col class="col-type">
            </colgroup>
            <tbody id="results-body"></tbody>
        </table>
        <div id="error-message" class="error-message" hidden></div>
    </section>

    <div id="loading" class="loading" hidden>
        <span class="spinner"></span> Querying...
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
